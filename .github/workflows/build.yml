name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v${{ github.run_number }} build/outputs/apk/debug/*.apk --title "v${{ github.run_number }}" --notes "APK"
